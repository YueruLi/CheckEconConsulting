name: Refresh listings

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch openings and events
        run: >-
          python -m econjobs
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          --new-summary new.md

      - name: Commit updated data and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Refresh listings"
          git push

      - name: Open an issue for new postings
        if: hashFiles('new.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "New econ consulting postings — $(date -u +%Y-%m-%d)" --body-file new.md

